name: PR Build Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install deps
        run: corepack pnpm install --frozen-lockfile

      - name: Enforce i18n on changed pages
        run: corepack pnpm run check:i18n

      - name: Enforce forbidden terms
        run: corepack pnpm run check:forbidden-terms

      - name: Lint
        run: corepack pnpm run lint

      - name: Build
        run: corepack pnpm run build
