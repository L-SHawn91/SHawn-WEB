name: PR Build Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Enforce i18n on changed pages
        run: npm run check:i18n

      - name: Enforce forbidden terms
        run: npm run check:forbidden-terms

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
