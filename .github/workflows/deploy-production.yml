name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight deployment secrets
        id: preflight
        run: |
          missing=()
          test -n "$VERCEL_TOKEN" || missing+=("VERCEL_TOKEN")
          test -n "$VERCEL_ORG_ID" || missing+=("VERCEL_ORG_ID")
          test -n "$VERCEL_PROJECT_ID" || missing+=("VERCEL_PROJECT_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production deploy skipped. Missing GitHub Actions secrets: ${missing[*]}"
            {
              echo "## Production deploy skipped"
              echo ""
              echo "Required GitHub Actions secrets are missing: \`${missing[*]}\`."
              echo ""
              echo "The build gate can still pass, but the public site will not update until these secrets are configured and this workflow is rerun."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Production deploy preflight passed."

      - name: Setup Node
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        if: steps.preflight.outputs.ready == 'true'
        run: corepack enable

      - name: Install Vercel CLI
        if: steps.preflight.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.preflight.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        if: steps.preflight.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: steps.preflight.outputs.ready == 'true'
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Production deployment: $DEPLOY_URL"
          {
            echo "## Production deployed"
            echo ""
            echo "Deployment URL: $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test production routes
        if: steps.preflight.outputs.ready == 'true' && env.PRODUCTION_URL != ''
        run: |
          curl -fsSL "$PRODUCTION_URL/" > /dev/null
          curl -fsSL "$PRODUCTION_URL/blog" > /dev/null
          curl -fsSL "$PRODUCTION_URL/privacy" > /dev/null
          curl -fsSL "$PRODUCTION_URL/sitemap.xml" > /dev/null
          curl -fsSL "$PRODUCTION_URL/invest" > /dev/null
          curl -fsSL "$PRODUCTION_URL/invest/reports" > /dev/null
          curl -fsSL "$PRODUCTION_URL/invest/archive" > /dev/null
          curl -fsSL "$PRODUCTION_URL/invest/dashboard" > /dev/null
          echo "Smoke test passed: $PRODUCTION_URL"
