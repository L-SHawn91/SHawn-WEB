<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="AI-generated LC3 p62 flux interpretation">
  <defs>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #1f2937; }
      .head { font: 700 28px Arial, sans-serif; fill: #111827; }
      .txt { font: 500 22px Arial, sans-serif; fill: #1f2937; }
      .panel { fill: #f8fafc; stroke: #334155; stroke-width: 3; rx: 16; }
      .up { fill: #b91c1c; font: 700 24px Arial, sans-serif; }
      .down { fill: #166534; font: 700 24px Arial, sans-serif; }
      .note { font: 600 20px Arial, sans-serif; fill: #7f1d1d; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="80" class="title">LC3 / p62 Flux Interpretation (AI Reference Illustration)</text>

  <rect x="80" y="150" width="680" height="560" class="panel"/>
  <text x="120" y="210" class="head">Condition A: Control</text>
  <text x="120" y="280" class="txt">LC3-II: baseline</text>
  <text x="120" y="330" class="txt">p62: baseline turnover</text>
  <text x="120" y="400" class="txt">Interpretation: steady-state flux</text>

  <rect x="840" y="150" width="680" height="560" class="panel"/>
  <text x="880" y="210" class="head">Condition B: + Bafilomycin A1</text>
  <text x="880" y="280" class="txt">LC3-II: accumulates</text>
  <text x="880" y="330" class="txt">p62: accumulates</text>
  <text x="880" y="400" class="txt">Interpretation: blocked lysosomal degradation</text>

  <text x="120" y="500" class="up">LC3-II ↑ can mean formation OR degradation block</text>
  <text x="120" y="545" class="down">Conclusion requires paired flux condition</text>

  <text x="60" y="840" class="note">Reference-only AI image (NanoBanana/OpenAI style). Not actual experimental data.</text>
</svg>
