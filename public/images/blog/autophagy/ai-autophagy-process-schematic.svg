<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="AI-generated autophagy process schematic">
  <defs>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 24px Arial, sans-serif; fill: #111827; }
      .small { font: 500 20px Arial, sans-serif; fill: #374151; }
      .box { fill: #eef6ff; stroke: #3b82f6; stroke-width: 3; rx: 18; }
      .arrow { stroke: #2563eb; stroke-width: 4; marker-end: url(#arr); fill: none; }
      .note { font: 600 20px Arial, sans-serif; fill: #7f1d1d; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="80" class="title">Autophagy Process (AI Reference Illustration)</text>

  <rect x="70" y="210" width="240" height="120" class="box"/>
  <text x="110" y="275" class="label">Initiation</text>

  <rect x="370" y="210" width="260" height="120" class="box"/>
  <text x="400" y="275" class="label">Phagophore</text>

  <rect x="700" y="210" width="280" height="120" class="box"/>
  <text x="735" y="275" class="label">Autophagosome</text>

  <rect x="1060" y="210" width="240" height="120" class="box"/>
  <text x="1090" y="275" class="label">Fusion</text>

  <rect x="1360" y="210" width="190" height="120" class="box"/>
  <text x="1388" y="275" class="label">Degradation</text>

  <path d="M310 270 L370 270" class="arrow"/>
  <path d="M630 270 L700 270" class="arrow"/>
  <path d="M980 270 L1060 270" class="arrow"/>
  <path d="M1300 270 L1360 270" class="arrow"/>

  <text x="70" y="410" class="small">Key markers: LC3-I -> LC3-II, p62 turnover, lysosomal function</text>
  <text x="70" y="460" class="small">Use flux-oriented interpretation, not single static readout.</text>

  <text x="60" y="840" class="note">Reference-only AI image (NanoBanana/OpenAI style). Not actual experimental data.</text>
</svg>
